name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build universal libusb
        run: |
          curl -sL -o libusb.tar.bz2 https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2
          tar xjf libusb.tar.bz2
          cd libusb-1.0.30
          CFLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=13.0 -O2" \
          LDFLAGS="-mmacosx-version-min=13.0" \
            ./configure --disable-udev --disable-examples-build --prefix="$RUNNER_TEMP/libusb" >/dev/null
          make -j"$(sysctl -n hw.ncpu)" >/dev/null
          make install >/dev/null
          lipo -info "$RUNNER_TEMP/libusb/lib/libusb-1.0.0.dylib"

      - name: Build apps
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/libusb/lib/pkgconfig
          LIBUSB_DYLIB_ARM64: ${{ runner.temp }}/libusb/lib/libusb-1.0.0.dylib
          LIBUSB_DYLIB_X86_64: ${{ runner.temp }}/libusb/lib/libusb-1.0.0.dylib
          CGO_CFLAGS: -mmacosx-version-min=13.0
          CGO_LDFLAGS: -mmacosx-version-min=13.0
        run: |
          set -eu
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          XCODE_BUILD() {
            xcodebuild -project DJOneHubNative.xcodeproj -scheme DJOneHubNative \
              -configuration Release -destination 'platform=macOS' \
              -derivedDataPath build/DerivedData ARCHS="$1" CODE_SIGN_IDENTITY="-" \
              MARKETING_VERSION="$VERSION" build
          }
          XCODE_BUILD "arm64 x86_64"
          cp -R build/DerivedData/Build/Products/Release/DJOneHub.app dist/DJOneHub.app
          XCODE_BUILD "arm64"
          cp -R build/DerivedData/Build/Products/Release/DJOneHub.app dist/DJOneHub-arm64.app
          XCODE_BUILD "x86_64"
          cp -R build/DerivedData/Build/Products/Release/DJOneHub.app dist/DJOneHub-x86_64.app

      - name: Verify macOS deployment target
        run: |
          set -euo pipefail
          EXPECTED_MINOS="13.0"

          check_minos() {
            local binary="$1"
            local values

            if [ ! -f "$binary" ]; then
              echo "::error file=$binary::Missing Mach-O binary"
              return 1
            fi

            values="$(vtool -show-build "$binary" | awk '$1 == "minos" { print $2 }')"
            if [ -z "$values" ]; then
              echo "::error file=$binary::Unable to read LC_BUILD_VERSION minos"
              return 1
            fi

            while IFS= read -r value; do
              if [ "$value" != "$EXPECTED_MINOS" ]; then
                echo "::error file=$binary::Expected minos $EXPECTED_MINOS, got $value"
                return 1
              fi
            done <<< "$values"

            echo "verified minos $EXPECTED_MINOS: $binary"
          }

          for app in \
            dist/DJOneHub.app \
            dist/DJOneHub-arm64.app \
            dist/DJOneHub-x86_64.app; do
            check_minos "$app/Contents/MacOS/DJOneHub"
            check_minos "$app/Contents/Resources/backend/djonehubd"
            check_minos "$app/Contents/Resources/backend/libusb-1.0.0.dylib"
          done

      - name: Package DMGs
        run: |
          set -eu
          pipx install dmgbuild
          export PATH="$HOME/.local/bin:$PATH"
          for VARIANT in "" "-arm64" "-x86_64"; do
            APP="DJOneHub${VARIANT}.app"
            [ -d "dist/$APP" ] || continue
            DMG="DJOneHub-${{ github.ref_name }}${VARIANT}.dmg"
            sed "s|DJOneHub-arm64.app|$APP|" scripts/dmgbuild.json > "/tmp/dmgbuild${VARIANT}.json"
            dmgbuild -s "/tmp/dmgbuild${VARIANT}.json" "DJOneHub" "dist/$DMG"
            echo "created dist/$DMG"
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            dist/DJOneHub-${{ github.ref_name }}.dmg
            dist/DJOneHub-${{ github.ref_name }}-arm64.dmg
            dist/DJOneHub-${{ github.ref_name }}-x86_64.dmg
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
