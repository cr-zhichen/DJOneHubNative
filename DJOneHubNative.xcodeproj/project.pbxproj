		21691655CA159507BA6E16AE /* 构建并嵌入 Go 后端 */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "构建并嵌入 Go 后端";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "#!/bin/sh\nset -eu\n\ncd \"${PROJECT_DIR}/backend\"\nexport CGO_ENABLED=1 GOOS=darwin\nexport GOCACHE=\"${TARGET_TEMP_DIR}/gocache\"\nexport PKG_CONFIG_PATH=\"${PKG_CONFIG_PATH:-/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig}\"\n\nlibusb_for() {\n  case \"$1\" in\n    x86_64) echo \"${LIBUSB_DYLIB_X86_64:-/usr/local/opt/libusb/lib/libusb-1.0.0.dylib}\" ;;\n    *)      echo \"${LIBUSB_DYLIB_ARM64:-/opt/homebrew/opt/libusb/lib/libusb-1.0.0.dylib}\" ;;\n  esac\n}\n\ngoarch() { [ \"$1\" = \"x86_64\" ] && echo \"amd64\" || echo \"arm64\"; }\n\n# 编译后端（按 ARCHS，支持 universal）\nmkdir -p \"${TARGET_TEMP_DIR}/backend\"\nfor a in ${ARCHS}; do\n  mkdir -p \"${TARGET_TEMP_DIR}/backend/${a}\"\n  GOARCH=\"$(goarch \"$a\")\" go build -trimpath -ldflags=\"-s -w\" \\\n    -o \"${TARGET_TEMP_DIR}/backend/${a}/djonehubd\" ./cmd/djonehub-macos\ndone\n\n# 合并到 app 资源目录\nBACKEND_DIR=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/backend\"\nrm -rf \"${BACKEND_DIR}\"\nmkdir -p \"${BACKEND_DIR}\"\nfor a in ${ARCHS}; do\n  cp \"${TARGET_TEMP_DIR}/backend/${a}/djonehubd\" \"${BACKEND_DIR}/djonehubd.${a}\"\ndone\nif [ \"$(echo ${ARCHS} | wc -w)\" -gt 1 ]; then\n  lipo -create \"${BACKEND_DIR}\"/djonehubd.* -output \"${BACKEND_DIR}/djonehubd\"\n  rm -f \"${BACKEND_DIR}\"/djonehubd.*\nelse\n  mv \"${BACKEND_DIR}/djonehubd.${ARCHS}\" \"${BACKEND_DIR}/djonehubd\"\nfi\n\n# libusb：按架构拷贝（universal 时优先用胖文件，否则 lipo 合并）并改为 @loader_path 引用\nif [ \"$(echo ${ARCHS} | wc -w)\" -gt 1 ]; then\n  UB=$(libusb_for \"$(echo ${ARCHS} | awk '{print $1}')\")\n  FAT=0\n  if [ -f \"$UB\" ]; then\n    info=$(lipo -info \"$UB\" 2>/dev/null || true)\n    case \"$info\" in *\"Architectures in the fat file\"*) FAT=1 ;; esac\n    if [ \"$FAT\" = \"1\" ]; then\n      for a in ${ARCHS}; do\n        echo \"$info\" | grep -q \"$a\" || { FAT=0; break; }\n      done\n    fi\n  fi\n  if [ \"$FAT\" = \"1\" ]; then\n    cp \"$UB\" \"${BACKEND_DIR}/libusb-1.0.0.dylib\"\n  else\n    FOUND=\"\"\n    for a in ${ARCHS}; do\n      LIBUSB=$(libusb_for \"$a\")\n      [ -f \"$LIBUSB\" ] || continue\n      cp \"$LIBUSB\" \"${BACKEND_DIR}/libusb.${a}\"\n      FOUND=\"$a\"\n    done\n    [ -n \"$FOUND\" ] || { echo \"错误：未找到 libusb，请设置 LIBUSB_DYLIB_ARM64 / LIBUSB_DYLIB_X86_64\" >&2; exit 1; }\n    lipo -create \"${BACKEND_DIR}\"/libusb.* -output \"${BACKEND_DIR}/libusb-1.0.0.dylib\"\n    rm -f \"${BACKEND_DIR}\"/libusb.*\n  fi\nelse\n  LIBUSB=$(libusb_for \"$ARCHS\")\n  [ -f \"$LIBUSB\" ] || { echo \"错误：未找到 libusb (${LIBUSB})，请设置 LIBUSB_DYLIB_ARM64 / LIBUSB_DYLIB_X86_64\" >&2; exit 1; }\n  cp \"$LIBUSB\" \"${BACKEND_DIR}/libusb-1.0.0.dylib\"\nfi\nold=$(otool -L \"${BACKEND_DIR}/djonehubd\" 2>/dev/null | awk '/libusb/ {print $1; exit}')\nif [ -n \"$old\" ]; then\n  install_name_tool -change \"$old\" \"@loader_path/libusb-1.0.0.dylib\" \"${BACKEND_DIR}/djonehubd\" || true\nfi\n";
		};
