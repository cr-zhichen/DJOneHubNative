[tools]
go = "1.26.3"

[tasks."backend:format"]
description = "格式化后端 Go 文件"
dir = "backend"
run = "gofmt -w cmd/djonehub-macos/call_dtmf*.go cmd/djonehub-macos/main.go cmd/djonehub-macos/usbat_darwin.go cmd/djonehub-macos/usbat_stub.go cmd/djonehub-cli/commands*.go cmd/djonehub-cli/schema.go internal/callnumber/*.go internal/modem/manager.go internal/modem/manager_execute_at_test.go"

[tasks."backend:test"]
description = "运行后端回归测试（不连接模块）"
dir = "backend"
run = "go test ./..."

[tasks."backend:race"]
description = "运行通话、CLI 与串口后端并发检查"
dir = "backend"
run = "go test -race ./cmd/djonehub-macos ./cmd/djonehub-cli ./internal/callnumber ./internal/modem"

[tasks."backend:vet"]
description = "静态检查后端"
dir = "backend"
run = "go vet ./..."

[tasks.build]
description = "用 Xcode 构建 .app 并输出到 dist/（本机架构）"
dir = "."
run = [
  "xcodebuild -project DJOneHubNative.xcodeproj -scheme DJOneHubNative -configuration Release -destination 'platform=macOS' -derivedDataPath build/DerivedData ARCHS=$(uname -m) PRODUCT_BUNDLE_IDENTIFIER=cn.flameapi.flamedjhub.dev DISPLAY_NAME=\"Flame DJ Hub\" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=\"DJOneHub Dev Local Signing\" build",
  "mkdir -p dist",
  "rm -rf 'dist/Flame DJ Hub-'$(uname -m)'.app'",
  "cp -R build/DerivedData/Build/Products/Release/DJOneHub.app 'dist/Flame DJ Hub-'$(uname -m)'.app'",
  "rm -rf build/DerivedData/Build/Products/Release/DJOneHub.app",
]

[tasks."build:arm64"]
description = "构建 arm64 包到 dist/"
dir = "."
run = [
  "xcodebuild -project DJOneHubNative.xcodeproj -scheme DJOneHubNative -configuration Release -destination 'platform=macOS' -derivedDataPath build/DerivedData ARCHS=arm64 PRODUCT_BUNDLE_IDENTIFIER=cn.flameapi.flamedjhub.dev DISPLAY_NAME=\"Flame DJ Hub\" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=\"DJOneHub Dev Local Signing\" build",
  "mkdir -p dist",
  "rm -rf 'dist/Flame DJ Hub-arm64.app'",
  "cp -R build/DerivedData/Build/Products/Release/DJOneHub.app 'dist/Flame DJ Hub-arm64.app'",
  "rm -rf build/DerivedData/Build/Products/Release/DJOneHub.app",
]

[tasks."build:x86_64"]
description = "构建 x86_64 包到 dist/（需设置 LIBUSB_DYLIB_X86_64）"
dir = "."
run = [
  "xcodebuild -project DJOneHubNative.xcodeproj -scheme DJOneHubNative -configuration Release -destination 'platform=macOS' -derivedDataPath build/DerivedData ARCHS=x86_64 PRODUCT_BUNDLE_IDENTIFIER=cn.flameapi.flamedjhub.dev DISPLAY_NAME=\"Flame DJ Hub\" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=\"DJOneHub Dev Local Signing\" build",
  "mkdir -p dist",
  "rm -rf 'dist/Flame DJ Hub-x86_64.app'",
  "cp -R build/DerivedData/Build/Products/Release/DJOneHub.app 'dist/Flame DJ Hub-x86_64.app'",
  "rm -rf build/DerivedData/Build/Products/Release/DJOneHub.app",
]

[tasks."build:universal"]
description = "构建通用包到 dist/（需设置 LIBUSB_DYLIB_ARM64 / LIBUSB_DYLIB_X86_64 指向通用 libusb）"
dir = "."
run = [
  "xcodebuild -project DJOneHubNative.xcodeproj -scheme DJOneHubNative -configuration Release -destination 'platform=macOS' -derivedDataPath build/DerivedData ARCHS='arm64 x86_64' PRODUCT_BUNDLE_IDENTIFIER=cn.flameapi.flamedjhub.dev DISPLAY_NAME=\"Flame DJ Hub\" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=\"DJOneHub Dev Local Signing\" build",
  "mkdir -p dist",
  "rm -rf 'dist/Flame DJ Hub.app'",
  "cp -R build/DerivedData/Build/Products/Release/DJOneHub.app 'dist/Flame DJ Hub.app'",
  "rm -rf build/DerivedData/Build/Products/Release/DJOneHub.app",
]

[tasks.launch]
description = "启动已构建的 app（本机架构优先，其次通用包）"
dir = "."
run = "open 'dist/Flame DJ Hub-'$(uname -m)'.app' 2>/dev/null || open 'dist/Flame DJ Hub.app'"

[tasks.kill]
description = "停止正在运行的 Flame DJ Hub 及其后端"
dir = "."
run = [
  "pkill -x DJOneHub 2>/dev/null || true",
  "pkill -x djonehubd 2>/dev/null || true",
]

[tasks.clean]
description = "清理 build/ 与 dist/"
dir = "."
run = "rm -rf build dist"

[tasks."audio:probe"]
description = "离线验证音频 PCM、重采样、设备枚举与停止屏障（不启动通话）"
run = "bash scripts/probe-call-audio.sh"
